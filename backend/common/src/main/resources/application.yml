server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB:2048}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:2048}MB
      file-size-threshold: 0B
      location: ${TEMP_UPLOAD_DIR:/tmp/vod-uploads}
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    connection-timeout: 5s
    channel-rpc-timeout: 5s
  application:
    name: vod-backend
  jackson:
    deserialization:
      # An integer field of a request body, such as releaseYear, rejects a number with a fraction
      # (400 MALFORMED_REQUEST) instead of silently truncating it.
      accept-float-as-int: false
    datatype:
      enum:
        # An enum field of a request body, such as status, accepts only its constant names: a JSON
        # number or a numeric string such as 1 or "1" is rejected (400 MALFORMED_REQUEST) instead of
        # being read as an ordinal.
        fail-on-numbers-for-enums: true
  jpa:
    # Lazy associations load inside service transactions only; no connection is held while a
    # response is rendered or streamed.
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

auth:
  tokens:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}d

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

storage:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  connect-timeout-ms: ${MINIO_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${MINIO_READ_TIMEOUT_MS:60000}
  write-timeout-ms: ${MINIO_WRITE_TIMEOUT_MS:60000}
  hls-bucket: ${MINIO_BUCKET_HLS:vod-hls}

upload:
  raw-bucket: ${MINIO_BUCKET_RAW:vod-raw}
  allowed-mime-types: ${ALLOWED_VIDEO_MIME_TYPES:video/mp4,video/x-matroska,video/webm,video/quicktime}

encoding:
  relay:
    interval-seconds: ${ENCODING_RELAY_INTERVAL_SECONDS:10}
  queue:
    name: ${RABBITMQ_ENCODING_QUEUE:video-encoding-queue}
    publish-confirm-timeout-ms: ${ENCODING_PUBLISH_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
