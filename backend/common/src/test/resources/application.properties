# Application tests run on H2 in PostgreSQL compatibility mode: the catalog inserts genres and
# people with "INSERT ... ON CONFLICT DO NOTHING" (ADR-009 concurrent creation), which H2 accepts
# only in that mode. Each test context gets its own in-memory database; the schema still comes from
# the entities.
spring.datasource.url=jdbc:h2:mem:app-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Explicit test fixtures; runtime storage credentials have no defaults.
storage.endpoint=http://127.0.0.1:9000
storage.access-key=test-backend
storage.secret-key=test-only-storage-secret

# Closed loopback fixture: ordinary tests must never contact a developer broker.
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=1
spring.rabbitmq.username=test-broker
spring.rabbitmq.password=test-only-broker-secret
spring.rabbitmq.connection-timeout=100ms
spring.rabbitmq.channel-rpc-timeout=100ms

# Isolated spool and dormant scheduler for cached Spring contexts.
spring.servlet.multipart.location=${java.io.tmpdir}/vod-backend-test-uploads/${random.uuid}
encoding.relay.interval-seconds=86400
