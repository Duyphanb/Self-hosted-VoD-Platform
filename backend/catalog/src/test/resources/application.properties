# Catalog tests run on H2 in PostgreSQL compatibility mode: genres and people are inserted with
# "INSERT ... ON CONFLICT DO NOTHING" (ADR-009 concurrent creation), which H2 accepts only in that
# mode. Each test context gets its own in-memory database; the schema still comes from the entities.
spring.datasource.url=jdbc:h2:mem:catalog-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.test.database.replace=none
