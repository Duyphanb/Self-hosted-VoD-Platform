# Status: Frozen for MVP implementation
openapi: 3.0.3
info:
  title: Self-hosted VoD Platform Public Contract
  version: 1.0.0-frozen
  description: >
    Frozen MVP public contract for the modular monolith plus worker architecture.
    Browser traffic enters through Nginx. JSON APIs use /api/v1/*.
    HLS uses /hls/* through the authenticated backend proxy.
    Refresh tokens use JSON request and response bodies only.
servers:
  - url: http://localhost
    description: Local Nginx edge
  - url: https://{domain}
    description: VPS Nginx edge
    variables:
      domain:
        default: example.com
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Movies
  - name: Upload
  - name: Stream
  - name: Search
  - name: Watchlist
  - name: History
  - name: Progress
  - name: Rating
  - name: Admin

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Public smoke health check
      security: []
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and return new tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/movies:
    get:
      tags: [Movies]
      summary: List published movies
      description: >
        Returns PUBLISHED movies only, for every role including ROLE_ADMIN.
        Admins list other statuses through GET /api/v1/admin/movies.
        Invalid query values return 400 VALIDATION_ERROR.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: genre
          in: query
          required: false
          description: >
            Genre name or slug. The value is normalized with the slug rule (see
            UpsertGenreRequest) and matched against the genre slug. A value that is empty after
            normalization returns 400; an unknown genre returns an empty page.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 1888
            maximum: 2100
        - $ref: "#/components/parameters/MovieSort"
      responses:
        "200":
          description: Movie page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoviePageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Movies, Admin]
      summary: Create movie metadata
      description: Requires ROLE_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMovieRequest"
      responses:
        "201":
          description: Created movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: MOVIE_SLUG_CONFLICT when the slug is already used by another movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/movies/{movieId}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [Movies]
      summary: Get movie details
      description: >
        ROLE_ADMIN can read a movie in any status. For every other caller a movie
        that is not PUBLISHED returns the same 404 MOVIE_NOT_FOUND response as a
        missing movie. A movieId that is not a UUID returns 400 VALIDATION_ERROR.
      responses:
        "200":
          description: Movie detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Movies, Admin]
      summary: Update movie metadata
      description: >
        Requires ROLE_ADMIN. Full replacement: omitted optional fields become null,
        and genres and people replace the existing assignments. Any MovieStatus is
        accepted; an archived movie is restored by setting DRAFT or PUBLISHED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMovieRequest"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: MOVIE_SLUG_CONFLICT when the slug is already used by another movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [Movies, Admin]
      summary: Archive movie metadata
      description: >
        Requires ROLE_ADMIN. Archive-only; sets status to ARCHIVED. No hard delete
        endpoint is exposed. Idempotent: archiving an already archived movie
        returns 204.
      responses:
        "204":
          description: Archived
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/movies:
    get:
      tags: [Movies, Admin]
      summary: List movies in any status for administration
      description: Requires ROLE_ADMIN. Without status, movies in every status are returned.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MovieStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/MovieSort"
      responses:
        "200":
          description: Movie page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoviePageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/genres:
    get:
      tags: [Movies, Admin]
      summary: List all genres
      description: Requires ROLE_ADMIN. Returns every genre ordered by name, then id. Not paginated.
      responses:
        "200":
          description: Genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Movies, Admin]
      summary: Create a genre
      description: Requires ROLE_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGenreRequest"
      responses:
        "201":
          description: Created genre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: GENRE_CONFLICT when another genre has the same name or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/genres/{genreId}:
    parameters:
      - $ref: "#/components/parameters/GenreId"
    put:
      tags: [Movies, Admin]
      summary: Rename a genre
      description: Requires ROLE_ADMIN. The slug is recomputed from the new name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGenreRequest"
      responses:
        "200":
          description: Updated genre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GENRE_CONFLICT when another genre has the same name or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/people:
    get:
      tags: [Movies, Admin]
      summary: Search people for credit assignment
      description: >
        Requires ROLE_ADMIN. When q is present it is normalized with the slug rule
        (see UpsertGenreRequest) and matched as a substring of the person slug, so
        matching ignores case and diacritics. A q that is empty after normalization
        is treated as absent. Results are ordered by name, then id.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Person page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Movies, Admin]
      summary: Create a person
      description: >
        Requires ROLE_ADMIN. Names are not unique. The server generates the slug
        with the slug rule (see UpsertGenreRequest), truncating the base to at most
        240 characters and removing a trailing hyphen, then appends -2, -3, ... on
        collision. A name whose slug is empty uses the base person. People created
        from name-only credits follow the same rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPersonRequest"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    put:
      tags: [Movies, Admin]
      summary: Rename a person
      description: >
        Requires ROLE_ADMIN. The slug is regenerated from the new name with the same
        rule; the person being renamed is excluded from the collision check, so the
        current slug is kept when its base is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPersonRequest"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/movies/{movieId}/video:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    post:
      tags: [Upload, Admin]
      summary: Upload raw video for a movie
      description: Requires ROLE_ADMIN. Stores raw video in MinIO and queues encoding.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload accepted and encoding queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAssetStatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/movies/{movieId}/playback:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [Stream]
      summary: Get playback information for a ready movie
      responses:
        "200":
          description: Playback info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /hls/video-assets/{videoAssetId}/master.m3u8:
    parameters:
      - $ref: "#/components/parameters/VideoAssetId"
    get:
      tags: [Stream]
      summary: Authenticated HLS master playlist
      description: Only MVP HLS path. Nginx /hls/* proxies to backend; bearer token required; no direct MinIO or presigned playback.
      responses:
        "200":
          description: HLS playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /hls/video-assets/{videoAssetId}/segments/{segmentName}:
    parameters:
      - $ref: "#/components/parameters/VideoAssetId"
      - name: segmentName
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]+\\.ts$"
    get:
      tags: [Stream]
      summary: Authenticated HLS segment
      description: Only MVP HLS path. Nginx /hls/* proxies to backend; bearer token required; no direct MinIO or presigned playback.
      responses:
        "200":
          description: HLS segment
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/movies/{movieId}/progress:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [Progress]
      summary: Get current user's playback progress for a movie
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Progress]
      summary: Save playback progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressRequest"
      responses:
        "202":
          description: Progress accepted for buffering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/movies/{movieId}/rating:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    put:
      tags: [Rating]
      summary: Create or update current user's rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search:
    get:
      tags: [Search]
      summary: Search movie catalog
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/search/suggestions:
    get:
      tags: [Search]
      summary: Get search suggestions
      description: MVP core helper for US-012 using persisted catalog metadata.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/watchlist:
    get:
      tags: [Watchlist]
      summary: Get current user's watchlist
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/watchlist/{movieId}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    put:
      tags: [Watchlist]
      summary: Add movie to watchlist
      responses:
        "200":
          description: Watchlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Watchlist]
      summary: Remove movie from watchlist
      description: >
        Idempotent for a published movie (204 whether or not it was in the
        watchlist). A missing or non-published movie returns 404.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/history:
    get:
      tags: [History]
      summary: Get current user's watch history
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: History page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/continue-watching:
    get:
      tags: [History, Progress]
      summary: Get current user's continue-watching list
      responses:
        "200":
          description: Continue-watching list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinueWatchingItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/video-assets:
    get:
      tags: [Admin]
      summary: List video assets and processing state
      description: Requires ROLE_ADMIN.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VideoAssetStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Video asset page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAssetPageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/video-assets/{videoAssetId}/retry:
    parameters:
      - $ref: "#/components/parameters/VideoAssetId"
    post:
      tags: [Admin]
      summary: Retry a failed encoding job
      description: Requires ROLE_ADMIN. Only FAILED assets are eligible.
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAssetStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MovieId:
      name: movieId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VideoAssetId:
      name: videoAssetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenreId:
      name: genreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MovieSort:
      name: sort
      in: query
      required: false
      description: >
        latest orders by creation time descending, then id descending.
        title orders by lower-cased title ascending, then id ascending.
      schema:
        type: string
        enum: [latest, title]
        default: latest
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: Uploaded file is larger than the configured limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    ApiError:
      type: object
      required: [timestamp, status, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
          description: >
            Machine-readable error code. Known codes include VALIDATION_ERROR,
            MALFORMED_REQUEST, UNAUTHORIZED, FORBIDDEN, MOVIE_NOT_FOUND,
            GENRE_NOT_FOUND, PERSON_NOT_FOUND, MOVIE_SLUG_CONFLICT and
            GENRE_CONFLICT. The list is not exhaustive.
        message:
          type: string
        requestId:
          type: string
          nullable: true
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Case-insensitive identity using database lower(email); original spelling retained, dots and plus tags remain significant.
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Case-insensitive identity using database lower(email); original spelling retained, dots and plus tags remain significant.
        password:
          type: string

    RefreshRequest:
      description: JSON-body refresh token request.
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          description: Opaque refresh token.
          type: string

    AuthResponse:
      description: JSON-body authentication result.
      type: object
      required: [user, accessToken, refreshToken, expiresInSeconds]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        accessToken:
          type: string
        refreshToken:
          description: Opaque refresh token.
          type: string
        expiresInSeconds:
          type: integer

    UserProfile:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ROLE_USER, ROLE_ADMIN]

    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100

    MovieStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    VideoAssetStatus:
      type: string
      enum: [UPLOADED, QUEUED, PROCESSING, READY, FAILED]

    MovieSummary:
      type: object
      required: [id, title, slug, genres, status, videoStatus]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        releaseYear:
          type: integer
          nullable: true
        posterUrl:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        averageRating:
          type: number
          format: float
          nullable: true
        status:
          $ref: "#/components/schemas/MovieStatus"
        videoStatus:
          description: >
            Latest video availability; null when the movie has no video asset, which
            is always the case until video upload is implemented. Values match
            VideoAssetStatus.
          type: string
          nullable: true
          enum: [UPLOADED, QUEUED, PROCESSING, READY, FAILED, null]

    MaturityRating:
      description: >
        Vietnamese film classification. P: all audiences; K: under 13 with a
        guardian; T13, T16, T18: minimum viewer age. C (not permitted for
        distribution) is intentionally excluded. Null means not classified.
      type: string
      nullable: true
      enum: [P, K, T13, T16, T18, null]

    MovieDetail:
      allOf:
        - $ref: "#/components/schemas/MovieSummary"
        - type: object
          properties:
            maturityRating:
              $ref: "#/components/schemas/MaturityRating"
            people:
              description: Credits in display order (sort_order).
              type: array
              items:
                $ref: "#/components/schemas/MovieCredit"
            userRating:
              type: integer
              nullable: true
            inWatchlist:
              type: boolean
            playbackProgress:
              description: Omitted when the caller has no saved progress for the movie.
              allOf:
                - $ref: "#/components/schemas/ProgressResponse"

    MovieCredit:
      type: object
      required: [personId, name, role]
      properties:
        personId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [ACTOR, DIRECTOR]

    MovieCreditInput:
      description: >
        Either personId or name is required. When personId is present it identifies
        the person and name is ignored; an unknown personId returns 400 with field
        people[i].personId. With name only, the name is normalized as in
        UpsertPersonRequest and compared case-insensitively (diacritics significant)
        against the stored names of all people: no match creates a person, exactly
        one match reuses that person, and more than one match returns 400 asking for
        a personId. Within one request, name-only entries with equal normalized
        names resolve to the same person, which is created at most once. A person
        may appear at most once per role in a request; a duplicate (person, role)
        pair, checked after resolving personId and name, returns 400
        VALIDATION_ERROR.
      type: object
      required: [role]
      properties:
        personId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          enum: [ACTOR, DIRECTOR]

    UpsertMovieRequest:
      description: >
        Admin movie metadata payload. PUT is a full replacement: omitted optional
        fields become null, and genres and people replace existing assignments.
        All strings are trimmed; blank values and NUL or other control characters
        (except line breaks and tabs in description) return 400 VALIDATION_ERROR.
        Genre names are matched by genre slug and reused when a genre with that
        slug exists (keeping its stored name); otherwise a genre is created. A genre
        name whose slug is empty, or two genres with the same slug in one request,
        return 400 VALIDATION_ERROR. The order of people
        defines credit display order.
      type: object
      required: [title, slug, description, genres, people, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          description: >
            URL-safe identifier, unique across movies. Clients may suggest it from
            the title; the backend validates it and does not generate it. Routes use
            the movie UUID, so the slug may change after publishing.
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: string
          minLength: 1
          maxLength: 5000
        releaseYear:
          type: integer
          minimum: 1888
          maximum: 2100
          nullable: true
        maturityRating:
          $ref: "#/components/schemas/MaturityRating"
        genres:
          description: Genre names, not genre IDs.
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 100
        people:
          description: May be empty. Omitting it is a validation error so credits are never cleared by accident.
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/MovieCreditInput"
        status:
          $ref: "#/components/schemas/MovieStatus"

    GenreResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    UpsertGenreRequest:
      description: >
        The name is trimmed and internal whitespace collapsed. Slug rule, used for
        genre and person slugs and for genre and people search input: decompose
        Unicode (NFD), remove combining marks, map đ/Đ to d, lower-case, replace
        every run of characters other than a-z and 0-9 with a hyphen, and trim
        leading and trailing hyphens. A genre name whose slug is empty, a blank
        name, or a name containing NUL or other control characters returns 400
        VALIDATION_ERROR.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    PersonResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    UpsertPersonRequest:
      description: >
        The name is trimmed and internal whitespace collapsed before storage; the
        stored value is what name-only credit matching compares against. Blank
        names and names containing NUL or other control characters return 400
        VALIDATION_ERROR.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    PersonPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonResponse"
        page:
          $ref: "#/components/schemas/PageMeta"

    MoviePageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MovieSummary"
        page:
          $ref: "#/components/schemas/PageMeta"

    VideoAssetStatusResponse:
      type: object
      required: [videoAssetId, status]
      properties:
        videoAssetId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VideoAssetStatus"
        message:
          type: string

    PlaybackInfo:
      type: object
      required: [movieId, videoAssetId, status, hlsManifestUrl]
      properties:
        movieId:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VideoAssetStatus"
        hlsManifestUrl:
          type: string
          example: /hls/video-assets/00000000-0000-0000-0000-000000000000/master.m3u8
        resumeSeconds:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          nullable: true

    ProgressRequest:
      type: object
      required: [currentSeconds, finished]
      properties:
        currentSeconds:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
          nullable: true
        finished:
          type: boolean

    ProgressResponse:
      type: object
      required: [movieId, currentSeconds, finished]
      properties:
        movieId:
          type: string
          format: uuid
        currentSeconds:
          type: integer
        durationSeconds:
          type: integer
          nullable: true
        finished:
          type: boolean
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true

    RatingRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5

    RatingResponse:
      type: object
      required: [movieId, rating]
      properties:
        movieId:
          type: string
          format: uuid
        rating:
          type: integer
        averageRating:
          type: number
          format: float
          nullable: true

    SearchResponse:
      type: object
      required: [query, items, page]
      properties:
        query:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/MovieSummary"
        page:
          $ref: "#/components/schemas/PageMeta"

    SearchSuggestionResponse:
      type: object
      required: [query, suggestions]
      properties:
        query:
          type: string
        suggestions:
          type: array
          items:
            type: string

    WatchlistItem:
      type: object
      required: [movie, createdAt]
      properties:
        movie:
          $ref: "#/components/schemas/MovieSummary"
        createdAt:
          type: string
          format: date-time

    HistoryItem:
      type: object
      required: [movie, startedAt, lastWatchedAt]
      properties:
        movie:
          $ref: "#/components/schemas/MovieSummary"
        startedAt:
          type: string
          format: date-time
        lastWatchedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    HistoryPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        page:
          $ref: "#/components/schemas/PageMeta"

    ContinueWatchingItem:
      type: object
      required: [movie, progress]
      properties:
        movie:
          $ref: "#/components/schemas/MovieSummary"
        progress:
          $ref: "#/components/schemas/ProgressResponse"

    VideoAssetAdmin:
      type: object
      required: [id, movieId, movieTitle, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        movieId:
          type: string
          format: uuid
        movieTitle:
          type: string
        status:
          $ref: "#/components/schemas/VideoAssetStatus"
        durationSeconds:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        codec:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        latestAttempt:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VideoAssetPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VideoAssetAdmin"
        page:
          $ref: "#/components/schemas/PageMeta"

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
