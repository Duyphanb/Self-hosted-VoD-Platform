name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Maven build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      - name: Build and test all backend modules
        working-directory: backend
        run: mvn -B -ntp verify

  worker-build:
    name: Worker Maven build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      - name: Build and test all worker modules
        working-directory: worker
        run: mvn -B -ntp verify

  skeleton:
    name: Skeleton build checks
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: vod-auth-audit-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production configuration fails closed
        run: sh deploy/tests/production-config-smoke.sh

      - name: Build backend image
        run: docker build -t vod-backend-skeleton ./backend

      - name: Build worker image
        run: docker build -t vod-worker-skeleton ./worker

      - name: Verify worker media tools
        run: docker run --rm vod-worker-skeleton sh -c "ffmpeg -version >/dev/null && ffprobe -version >/dev/null"

      - name: Build frontend image
        run: docker build -t vod-frontend-skeleton ./frontend

      - name: Verify Nginx SPA and reserved route boundaries
        run: sh deploy/tests/nginx-routing-smoke.sh vod-frontend-skeleton

      - name: Build compose application images
        run: docker compose -f deploy/docker-compose.yml build backend worker frontend

      - name: Verify auth against PostgreSQL and Nginx
        env:
          NGINX_HTTP_PORT: 127.0.0.1:18087
          JWT_SECRET: ci-audit-only-signing-key-not-for-production-0917
          CORS_ALLOWED_ORIGINS: http://localhost:18087
        run: |
          cleanup() { docker compose --env-file /dev/null -f deploy/docker-compose.yml down --volumes; }
          trap cleanup EXIT
          # Auth needs PostgreSQL and the edge, not the future media storage flow.
          # Keep this fixture independent of the object-store lifecycle decision (#14).
          docker compose --env-file /dev/null -f deploy/docker-compose.yml up --wait --wait-timeout 180 --no-build postgres redis rabbitmq frontend
          docker compose --env-file /dev/null -f deploy/docker-compose.yml run --rm --no-deps flyway
          docker compose --env-file /dev/null -f deploy/docker-compose.yml up --wait --wait-timeout 180 --no-build --no-deps backend nginx
          python3 deploy/tests/auth-runtime-smoke.py --project "$COMPOSE_PROJECT_NAME" --base-url http://127.0.0.1:18087
          # Assertion diagnostics can include response tokens. Keep only the exit status.
          if npx --yes newman@6.2.2 run docs/testing/postman/vod-platform-sprint-2-auth.postman_collection.json -e docs/testing/postman/vod-platform-local.postman_environment.json --env-var baseUrl=http://127.0.0.1:18087 --silent; then
            echo "PASS Newman Sprint 2 auth collection"
          else
            echo "FAIL Newman Sprint 2 auth collection (response details withheld)"
            exit 1
          fi

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  schema-migration:
    name: Flyway schema migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vod
          POSTGRES_USER: vod
          POSTGRES_PASSWORD: vod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vod -d vod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply Flyway migration
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/backend/common/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:12.10.0
          -url=jdbc:postgresql://localhost:5432/vod
          -user=vod
          -password=vod
          -connectRetries=60
          migrate

      - name: Verify ERD schema counts
        run: |
          query() {
            docker run --rm --network host -e PGPASSWORD=vod postgres:16-alpine psql -h localhost -U vod -d vod -Atc "$1"
          }
          test "$(query "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' AND table_name <> 'flyway_schema_history';")" = "15"
          test "$(query "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname ~ '^(ux|ix)_';")" = "31"
          test "$(query "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND t.relname IN ('users', 'roles', 'user_roles', 'refresh_tokens', 'movies', 'genres', 'movie_genres', 'people', 'movie_credits', 'video_assets', 'encoding_jobs', 'playback_progress', 'watchlist_items', 'watch_history', 'ratings');")" = "53"
          test "$(query "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND c.contype = 'f' AND t.relname IN ('users', 'roles', 'user_roles', 'refresh_tokens', 'movies', 'genres', 'movie_genres', 'people', 'movie_credits', 'video_assets', 'encoding_jobs', 'playback_progress', 'watchlist_items', 'watch_history', 'ratings');")" = "17"
          test "$(query "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND c.contype = 'c' AND t.relname IN ('users', 'roles', 'user_roles', 'refresh_tokens', 'movies', 'genres', 'movie_genres', 'people', 'movie_credits', 'video_assets', 'encoding_jobs', 'playback_progress', 'watchlist_items', 'watch_history', 'ratings');")" = "9"

      - name: Verify email migration collision safety
        run: sh deploy/tests/email-migration-smoke.sh
