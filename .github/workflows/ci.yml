name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Pull request runs share a group per pull request so superseded runs are cancelled.
# Every push to main gets its own group so each merged commit keeps a CI result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-build:
    name: Backend Maven build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      # #119: the Spring context tests run on a PostgreSQL 16 Testcontainers database with the Flyway
      # migrations, so this needs Docker. -DskipPostgresTests is for machines without Docker; never set here.
      - name: Build and test all backend modules
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Require executed PostgreSQL context test evidence
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ['PostgresMigrationTests', 'PostgresTestDatabaseIsolationTests', 'EmailIdentityPostgresTests',
                    'UploadPostgresTests', 'UploadEndpointPostgresTests']
          for suite in suites:
              report = ET.parse(f'backend/common/target/surefire-reports/TEST-com.vodplatform.common.{suite}.xml').getroot()
              assert int(report.attrib['tests']) > 0, f'{suite} must execute tests'
              for key in ('skipped', 'failures', 'errors'):
                  assert int(report.attrib[key]) == 0, f'{suite} has {key}'
          PY

  worker-build:
    name: Worker Maven build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      - name: Reject committed media files
        run: python3 deploy/tests/committed-media-check.py

      - name: Build and test all worker modules
        working-directory: worker
        run: mvn -B -ntp verify

      # #123: generated fixtures and the ADR-010 D27 reference encode, on the worker image's own
      # ffmpeg/ffprobe (the ffmpeg-test stage shares the runtime stage's layers).
      - name: Run FFmpeg-tagged tests in the worker image
        run: sh deploy/tests/worker-ffmpeg-tests.sh

  skeleton:
    name: Skeleton build checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: vod-auth-audit-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      - name: Verify storage supply chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s deploy/tests -p 'test_*.py'
          python3 deploy/tests/storage-runtime-smoke.py --project "$COMPOSE_PROJECT_NAME" --verify-only

      - name: Verify production configuration fails closed
        run: sh deploy/tests/production-config-smoke.sh

      - name: Build backend image
        run: docker build -t vod-backend-skeleton ./backend

      - name: Build worker image
        run: docker build -t vod-worker-skeleton ./worker

      - name: Verify worker media tools
        run: docker run --rm vod-worker-skeleton sh -c "ffmpeg -version >/dev/null && ffprobe -version >/dev/null"

      - name: Build frontend image
        run: docker build -t vod-frontend-skeleton ./frontend

      - name: Verify Nginx SPA and reserved route boundaries
        run: sh deploy/tests/nginx-routing-smoke.sh vod-frontend-skeleton

      - name: Verify upload edge limits, streaming and error responses
        run: python3 deploy/tests/nginx-edge-smoke.py --project "${COMPOSE_PROJECT_NAME}-edge"

      - name: Build compose application images
        run: docker compose -f deploy/docker-compose.yml build backend worker frontend

      - name: Verify RabbitMQ publisher on a disposable broker
        run: python3 deploy/tests/rabbitmq-publisher-smoke.py --project "${COMPOSE_PROJECT_NAME}-amqp"

      - name: Verify auth, catalog and upload against PostgreSQL and Nginx
        env:
          GH_TOKEN: ${{ github.token }}
          NGINX_HTTP_PORT: 127.0.0.1:18087
          CORS_ALLOWED_ORIGINS: http://localhost:18087
          # This step only: a 1 MiB backend limit lets the upload collection prove the backend 413
          # ApiError through the edge with a small generated file. Other suites send no multipart.
          MAX_UPLOAD_SIZE_MB: "1"
        run: |
          cleanup() { docker compose --env-file /dev/null -f deploy/docker-compose.yml down --volumes --remove-orphans; }
          trap cleanup EXIT
          JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          MINIO_ACCESS_KEY="$(python3 -c 'import secrets; print("audit_" + secrets.token_hex(12))')"
          MINIO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          MINIO_BACKEND_ACCESS_KEY="$(python3 -c 'import secrets; print("audit_" + secrets.token_hex(12))')"
          MINIO_BACKEND_SECRET_KEY="$(python3 -c 'import secrets; print("audit_" + secrets.token_hex(12))')"
          MINIO_WORKER_ACCESS_KEY="$(python3 -c 'import secrets; print("audit_" + secrets.token_hex(12))')"
          MINIO_WORKER_SECRET_KEY="$(python3 -c 'import secrets; print("audit_" + secrets.token_hex(12))')"
          POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SPRING_DATASOURCE_PASSWORD="$POSTGRES_PASSWORD"
          RABBITMQ_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export MINIO_BACKEND_ACCESS_KEY MINIO_BACKEND_SECRET_KEY MINIO_WORKER_ACCESS_KEY MINIO_WORKER_SECRET_KEY
          export JWT_SECRET MINIO_ACCESS_KEY MINIO_SECRET_KEY POSTGRES_PASSWORD SPRING_DATASOURCE_PASSWORD RABBITMQ_PASSWORD
          python3 deploy/tests/storage-runtime-smoke.py --project "$COMPOSE_PROJECT_NAME"
          python3 deploy/tests/storage-sdk-smoke.py --project "${COMPOSE_PROJECT_NAME}-sdk"
          # Fresh full stack, including private storage/init and the dedicated worker.
          docker compose --env-file /dev/null -f deploy/docker-compose.yml up -d --wait --wait-timeout 180 --no-build
          python3 -c 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:18087/actuator/health", timeout=10); assert response.status == 200 and json.load(response)["status"] == "UP", "Backend dependency readiness through Nginx failed"'
          python3 deploy/tests/auth-runtime-smoke.py --project "$COMPOSE_PROJECT_NAME" --base-url http://127.0.0.1:18087
          # Assertion diagnostics can include response tokens. Keep only the exit status.
          if npx --yes newman@6.2.2 run docs/testing/postman/vod-platform-sprint-2-auth.postman_collection.json -e docs/testing/postman/vod-platform-local.postman_environment.json --env-var baseUrl=http://127.0.0.1:18087 --silent; then
            echo "PASS Newman Sprint 2 auth collection"
          else
            echo "FAIL Newman Sprint 2 auth collection (response details withheld)"
            exit 1
          fi
          # Same project after the auth checks: the catalog smoke needs an empty catalog, not an empty
          # users table, and promotes its admin with the documented first-administrator SQL.
          python3 deploy/tests/catalog-runtime-smoke.py --project "$COMPOSE_PROJECT_NAME" --base-url http://127.0.0.1:18087
          # The catalog collection signs in as an administrator promoted with the documented SQL.
          # The password is generated for this run only and never printed.
          NEWMAN_ADMIN_EMAIL="newman-admin-${GITHUB_RUN_ID}@example.com"
          NEWMAN_ADMIN_PASSWORD="$(python3 -c 'import secrets; print("Newman-" + secrets.token_urlsafe(18))')"
          export NEWMAN_ADMIN_EMAIL NEWMAN_ADMIN_PASSWORD
          python3 deploy/tests/newman-catalog-admin.py --project "$COMPOSE_PROJECT_NAME" --base-url http://127.0.0.1:18087
          if npx --yes newman@6.2.2 run docs/testing/postman/vod-platform-sprint-3-catalog.postman_collection.json -e docs/testing/postman/vod-platform-local.postman_environment.json --env-var baseUrl=http://127.0.0.1:18087 --env-var "adminEmail=$NEWMAN_ADMIN_EMAIL" --env-var "adminPassword=$NEWMAN_ADMIN_PASSWORD" --silent; then
            echo "PASS Newman Sprint 3 catalog collection"
          else
            echo "FAIL Newman Sprint 3 catalog collection (response details withheld)"
            exit 1
          fi
          # The upload collection reuses the same administrator. Its files are generated at runtime and
          # its two movies are seeded (one with an in-flight asset for the 409), so no worker timing
          # is involved. The accepted upload streams to the stack's private raw bucket.
          UPLOAD_FIXTURES_DIR="$RUNNER_TEMP/newman-upload"
          UPLOAD_FIXTURES="$(python3 deploy/tests/newman-upload-fixtures.py --project "$COMPOSE_PROJECT_NAME" --base-url http://127.0.0.1:18087 --fixtures-dir "$UPLOAD_FIXTURES_DIR")"
          UPLOAD_MOVIE_ID="$(printf '%s\n' "$UPLOAD_FIXTURES" | sed -n 's/^uploadMovieId=//p')"
          IN_FLIGHT_MOVIE_ID="$(printf '%s\n' "$UPLOAD_FIXTURES" | sed -n 's/^inFlightMovieId=//p')"
          if npx --yes newman@6.2.2 run docs/testing/postman/vod-platform-sprint-4-upload.postman_collection.json -e docs/testing/postman/vod-platform-local.postman_environment.json --working-dir "$UPLOAD_FIXTURES_DIR" --env-var baseUrl=http://127.0.0.1:18087 --env-var "adminEmail=$NEWMAN_ADMIN_EMAIL" --env-var "adminPassword=$NEWMAN_ADMIN_PASSWORD" --env-var "uploadMovieId=$UPLOAD_MOVIE_ID" --env-var "inFlightMovieId=$IN_FLIGHT_MOVIE_ID" --silent; then
            echo "PASS Newman Sprint 4 upload collection"
          else
            echo "FAIL Newman Sprint 4 upload collection (response details withheld)"
            exit 1
          fi

      - name: Preserve redacted storage SDK diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-sdk-diagnostics
          path: backend/common/target/storage-sdk-smoke/**/first-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve redacted RabbitMQ publisher diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rabbitmq-publisher-diagnostics
          path: backend/common/target/rabbitmq-publisher-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  schema-migration:
    name: Flyway schema migration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned by digest so the schema snapshot is not affected by image updates (#118).
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: vod_upload_test
          POSTGRES_USER: vod
          POSTGRES_PASSWORD: vod
          # Same cluster collation as deploy/docker-compose.yml (ADR-009).
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=vi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vod -d vod_upload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the comparison base of the change is available.
          fetch-depth: 0
          persist-credentials: false

      - name: Reject edits to committed migrations
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 deploy/tests/migration-immutability-check.py --base "$BASE_SHA"

      - name: Apply Flyway migration
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/backend/common/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:12.10.0
          -url=jdbc:postgresql://localhost:5432/vod_upload_test
          -user=vod
          -password=vod
          -connectRetries=60
          -validateMigrationNaming=true
          migrate

      - name: Compare the migrated schema with the committed snapshot
        run: python3 deploy/tests/schema-snapshot.py --container "${{ job.services.postgres.id }}" --user vod --database vod_upload_test

      - name: Verify email migration collision safety
        run: sh deploy/tests/email-migration-smoke.sh

      - name: Verify video asset migration preflight and in-flight index
        run: sh deploy/tests/video-asset-migration-smoke.sh

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: "21"
          cache: maven

      # The catalog and encoding slices cannot see the migrations, so their PostgreSQL suites run against
      # this migrated service. The upload suites run in the backend build on its PostgreSQL container (#119).
      - name: Verify catalog and video asset persistence against required PostgreSQL
        working-directory: backend
        env:
          ENCODING_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/vod_upload_test
          ENCODING_TEST_POSTGRES_USER: vod
          ENCODING_TEST_POSTGRES_PASSWORD: vod
          ENCODING_TEST_POSTGRES_REQUIRED: "true"
          CATALOG_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/vod_upload_test?user=vod&password=vod
        run: mvn -B -ntp -pl encoding -am -Dtest=VideoAssetPostgresTest,CreationOrderPostgresTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Require executed PostgreSQL test evidence
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          paths = ['backend/encoding/target/surefire-reports/TEST-com.vodplatform.encoding.persistence.VideoAssetPostgresTest.xml',
                   'backend/catalog/target/surefire-reports/TEST-com.vodplatform.catalog.service.CreationOrderPostgresTest.xml']
          for path in paths:
              report = ET.parse(path).getroot()
              assert int(report.attrib['tests']) > 0, 'PostgreSQL suite must execute tests'
              for key in ('skipped', 'failures', 'errors'):
                  assert int(report.attrib[key]) == 0, f'PostgreSQL suite has {key}'
          PY
