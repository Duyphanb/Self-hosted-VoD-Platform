name: Chrome playback smoke

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright dependencies and Google Chrome
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chrome
          google-chrome --version

      - name: Upload, transcode and play on the real stack
        run: python3 deploy/tests/chrome-playback-smoke.py
