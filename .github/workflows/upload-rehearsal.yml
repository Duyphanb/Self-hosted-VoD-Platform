name: Synthetic 2 GB upload rehearsal

# Deliberately no push, pull_request or schedule trigger. The merged workflow is
# dispatched on main; this measures a GitHub runner and cannot close VPS gate #180.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-upload-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Synthetic transport and storage measurement (not VPS evidence)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: vod-auth-audit-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure synthetic 2,000,000,000-byte transport/storage (not VPS evidence)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 deploy/tests/upload-rehearsal.py
          --project "$COMPOSE_PROJECT_NAME"
          --output-dir "$RUNNER_TEMP/upload-rehearsal-artifact"

      - name: Remove disposable rehearsal resources even after cancellation
        if: ${{ always() }}
        run: python3 deploy/tests/upload-rehearsal.py --project "$COMPOSE_PROJECT_NAME" --cleanup-only

      - name: Preserve measurement (not VPS evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-upload-rehearsal-not-vps-evidence
          path: ${{ runner.temp }}/upload-rehearsal-artifact/
          if-no-files-found: warn
          retention-days: 14
