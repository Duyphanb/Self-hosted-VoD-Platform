version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 1

  - package-ecosystem: maven
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 1
