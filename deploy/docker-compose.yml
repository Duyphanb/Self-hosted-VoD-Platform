name: vod-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vod_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vod_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # Vietnamese ICU collation for title and name ordering (ADR-009). Applies when the cluster is
      # first created; an existing volume keeps its collation (see docs/deployment/README.md).
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=vi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vod_internal

  redis:
    image: redis:7-alpine
    # #106: the password reaches redis-server as stdin configuration, never argv.
    entrypoint: ["/bin/sh", "/init/redis-entrypoint.sh"]
    command: ["redis-server", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    volumes:
      - ./redis-entrypoint.sh:/init/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vod_internal

  rabbitmq:
    # RabbitMQ 4.4.0 / Erlang 29.1.2 / Alpine 3.24, Docker official multi-arch index (amd64, arm64);
    # community support ends 2027-07-31 (#74). Bump with the broker update procedure in
    # docs/architecture/INFRASTRUCTURE.md (Broker runtime image).
    image: docker.io/library/rabbitmq:4.4.0-alpine@sha256:21577d148f4f7563a87d761862fa353f59348a094833ca8b1b1a46a8102dffce
    # Data lives under the node name rabbit@<hostname>; a fixed hostname keeps it across recreation.
    hostname: rabbitmq
    # #106: boot-time definitions hold the bootstrap administrator and the scoped
    # backend/worker users; the rendered file lives on the tmpfs only.
    entrypoint: ["/bin/sh", "/init/rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-vod_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_BACKEND_USERNAME: ${RABBITMQ_BACKEND_USERNAME:-vod_backend}
      RABBITMQ_BACKEND_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:-change-me-mq-backend}
      RABBITMQ_WORKER_USERNAME: ${RABBITMQ_WORKER_USERNAME:-vod_worker}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:-change-me-mq-worker}
      RABBITMQ_ENCODING_QUEUE: ${RABBITMQ_ENCODING_QUEUE:-video-encoding-queue}
    tmpfs:
      - /run/vod-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-entrypoint.sh:/init/rabbitmq-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vod_internal

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-vod_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vod_internal

  postgres-init:
    image: postgres:16-alpine
    # #106: one-shot role provisioning with the bootstrap superuser, before Flyway.
    entrypoint: ["/bin/sh", "/init/postgres-init.sh"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vod_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vod_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-vod_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-change-me-db-owner}
      POSTGRES_BACKEND_USER: ${POSTGRES_BACKEND_USER:-vod_backend}
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:-change-me-db-backend}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-vod_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-change-me-db-worker}
    volumes:
      - ./postgres-init.sh:/init/postgres-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vod_internal

  flyway:
    image: flyway/flyway:12.10.0
    environment:
      FLYWAY_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vod_platform}
      # #106: the schema owner migrates; its afterMigrate callback grants the application roles.
      FLYWAY_USER: ${POSTGRES_OWNER_USER:-vod_owner}
      FLYWAY_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-change-me-db-owner}
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/callbacks
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_PLACEHOLDERS_BACKEND_ROLE: ${POSTGRES_BACKEND_USER:-vod_backend}
      FLYWAY_PLACEHOLDERS_WORKER_ROLE: ${POSTGRES_WORKER_USER:-vod_worker}
    command:
      - migrate
    volumes:
      - ../backend/common/src/main/resources/db/migration:/flyway/sql:ro
      - ./flyway:/flyway/callbacks:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    networks:
      - vod_internal

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vod_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-vod-raw}
      MINIO_BUCKET_HLS: ${MINIO_BUCKET_HLS:-vod-hls}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-vod-thumbnails}
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:-vod_backend}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:-change-me-backend-only}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:-vod_worker}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:-change-me-worker-only}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/storage-init.sh"]
    volumes:
      - ./minio-init.sh:/init/storage-init.sh:ro
    networks:
      - vod_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Same database as FLYWAY_URL unless explicitly overridden; production rejects a different URL.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vod_platform}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_BACKEND_USER:-vod_backend}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:-change-me-db-backend}
      # Flyway owns the schema. Hibernate only validates the entity mapping, so drift fails startup.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-secret}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_BACKEND_USERNAME:-vod_backend}
      RABBITMQ_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:-change-me-mq-backend}
      RABBITMQ_ENCODING_QUEUE: ${RABBITMQ_ENCODING_QUEUE:-video-encoding-queue}
      ENCODING_RELAY_INTERVAL_SECONDS: ${ENCODING_RELAY_INTERVAL_SECONDS:-10}
      ENCODING_PUBLISH_CONFIRM_TIMEOUT_MS: ${ENCODING_PUBLISH_CONFIRM_TIMEOUT_MS:-5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_CONNECT_TIMEOUT_MS: ${MINIO_CONNECT_TIMEOUT_MS:-10000}
      MINIO_READ_TIMEOUT_MS: ${MINIO_READ_TIMEOUT_MS:-60000}
      MINIO_WRITE_TIMEOUT_MS: ${MINIO_WRITE_TIMEOUT_MS:-60000}
      MINIO_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:-vod_backend}
      MINIO_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:-change-me-backend-only}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-vod-raw}
      MINIO_BUCKET_HLS: ${MINIO_BUCKET_HLS:-vod-hls}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-vod-thumbnails}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      ALLOWED_VIDEO_MIME_TYPES: ${ALLOWED_VIDEO_MIME_TYPES:-video/mp4,video/x-matroska,video/webm,video/quicktime}
      TEMP_UPLOAD_DIR: ${TEMP_UPLOAD_DIR:-/tmp/vod-uploads}
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # The only service on both networks: Nginx reaches it on the edge, it reaches the data stores.
    networks:
      - vod_edge
      - vod_internal

  worker:
    scale: 1
    stop_grace_period: 30s
    build:
      context: ../worker
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      WORKER_TEMP_DIR: ${WORKER_TEMP_DIR:-/tmp/vod-worker}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
      HLS_TARGET_HEIGHT: ${HLS_TARGET_HEIGHT:-720}
      WORKER_MAX_DURATION_SECONDS: ${WORKER_MAX_DURATION_SECONDS:-10800}
      WORKER_MAX_WIDTH: ${WORKER_MAX_WIDTH:-1920}
      WORKER_MAX_HEIGHT: ${WORKER_MAX_HEIGHT:-1080}
      WORKER_MAX_STREAMS: ${WORKER_MAX_STREAMS:-8}
      HLS_VIDEO_MAXRATE_KBPS: ${HLS_VIDEO_MAXRATE_KBPS:-4000}
      WORKER_FFMPEG_THREADS: ${WORKER_FFMPEG_THREADS:-1}
      WORKER_OUTPUT_BUDGET_KBPS: ${WORKER_OUTPUT_BUDGET_KBPS:-5000}
      WORKER_DISK_RESERVE_MB: ${WORKER_DISK_RESERVE_MB:-5120}
      WORKER_FFPROBE_TIMEOUT_SECONDS: ${WORKER_FFPROBE_TIMEOUT_SECONDS:-}
      WORKER_FFMPEG_TIMEOUT_MIN_SECONDS: ${WORKER_FFMPEG_TIMEOUT_MIN_SECONDS:-}
      WORKER_FFMPEG_TIMEOUT_FACTOR: ${WORKER_FFMPEG_TIMEOUT_FACTOR:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vod_platform}}
      WORKER_JDBC_CONNECT_TIMEOUT_SECONDS: ${WORKER_JDBC_CONNECT_TIMEOUT_SECONDS:-5}
      WORKER_JDBC_READ_TIMEOUT_SECONDS: ${WORKER_JDBC_READ_TIMEOUT_SECONDS:-10}
      WORKER_JDBC_STATEMENT_TIMEOUT_MS: ${WORKER_JDBC_STATEMENT_TIMEOUT_MS:-5000}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_WORKER_USER:-vod_worker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-change-me-db-worker}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_WORKER_USERNAME:-vod_worker}
      RABBITMQ_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:-change-me-mq-worker}
      RABBITMQ_ENCODING_QUEUE: ${RABBITMQ_ENCODING_QUEUE:-video-encoding-queue}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_CONNECT_TIMEOUT_MS: ${MINIO_CONNECT_TIMEOUT_MS:-10000}
      MINIO_READ_TIMEOUT_MS: ${MINIO_READ_TIMEOUT_MS:-60000}
      MINIO_WRITE_TIMEOUT_MS: ${MINIO_WRITE_TIMEOUT_MS:-60000}
      MINIO_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:-vod_worker}
      MINIO_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:-change-me-worker-only}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-vod-raw}
      MINIO_BUCKET_HLS: ${MINIO_BUCKET_HLS:-vod-hls}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-vod-thumbnails}
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - vod_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vod_edge

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      # Loopback by default: the local JWT_SECRET placeholder is public.
      - "${NGINX_HTTP_PORT:-127.0.0.1:80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vod_edge

# #106: Nginx and the frontend reach only the edge network. The data stores, init jobs
# and worker sit on the internal network, which has no route outside Docker, so they
# publish no ports and have no egress. The backend joins both.
networks:
  vod_edge:
    driver: bridge
  vod_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
