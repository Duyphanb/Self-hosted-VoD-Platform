events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;
    client_max_body_size 1m;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /api/v1 {
            return 404;
        }

        location /api/v1/ {
            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;

            # Keep backend ApiError bodies, including upload 500/503, unchanged.
            proxy_intercept_errors off;
            error_page 413 = @api_error_413;
            error_page 502 = @api_error_502;
            error_page 503 = @api_error_503;
            error_page 504 = @api_error_504;

            # Inherit HTTP/1.1, forwarded headers and API error handling.
            # The URI-less proxy_pass is required inside a regex location.
            location ~ ^/api/v1/admin/movies/[^/]+/video$ {
                proxy_pass http://backend_upstream;
                client_max_body_size 2048m;
                proxy_request_buffering off;
                proxy_read_timeout 600s;
            }
        }

        # No add_header here: retain all server-level security headers on errors.
        # Only fixed text and Nginx-generated variables enter these JSON bodies.
        location @api_error_413 {
            types { }
            default_type application/json;
            return 413 '{"timestamp":"$time_iso8601","status":413,"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds the configured size limit.","requestId":"$request_id"}';
        }

        location @api_error_502 {
            types { }
            default_type application/json;
            return 502 '{"timestamp":"$time_iso8601","status":502,"code":"UPSTREAM_UNAVAILABLE","message":"The upstream service is unavailable.","requestId":"$request_id"}';
        }

        location @api_error_503 {
            types { }
            default_type application/json;
            return 503 '{"timestamp":"$time_iso8601","status":503,"code":"UPSTREAM_UNAVAILABLE","message":"The upstream service is unavailable.","requestId":"$request_id"}';
        }

        location @api_error_504 {
            types { }
            default_type application/json;
            return 504 '{"timestamp":"$time_iso8601","status":504,"code":"UPSTREAM_TIMEOUT","message":"The upstream service did not respond in time.","requestId":"$request_id"}';
        }

        location = /hls {
            return 404;
        }

        location /hls/ {
            proxy_pass http://backend_upstream/hls/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
        }

        location = /actuator/health {
            proxy_pass http://backend_upstream/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    # Phase 5 HTTPS placeholder. Certificate provisioning and renewal with
    # Let's Encrypt are intentionally deferred until a public domain is ready.
    # Reuse the complete HTTP server routing and named error locations above
    # when enabling HTTPS, including the upload location and security headers.
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     server_name <PUBLIC_DOMAIN>;
    #
    #     ssl_certificate /etc/letsencrypt/live/<PUBLIC_DOMAIN>/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/<PUBLIC_DOMAIN>/privkey.pem;
    # }
}
