services:
  production-config-check:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/checks/production-config-check.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a non-default production PostgreSQL username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default production PostgreSQL password}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:?Set an independent production PostgreSQL schema owner username}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set an independent production PostgreSQL schema owner password}
      POSTGRES_BACKEND_USER: ${POSTGRES_BACKEND_USER:?Set an independent production PostgreSQL backend username}
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:?Set an independent production PostgreSQL backend password}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:?Set an independent production PostgreSQL worker username}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set an independent production PostgreSQL worker password}
      # Same expressions as the base backend/worker and Flyway; the check rejects a split database.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vod_platform}}
      FLYWAY_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vod_platform}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a non-default production Redis password}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set a non-default production RabbitMQ username}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set a non-default production RabbitMQ password}
      RABBITMQ_BACKEND_USERNAME: ${RABBITMQ_BACKEND_USERNAME:?Set an independent production RabbitMQ backend username}
      RABBITMQ_BACKEND_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:?Set an independent production RabbitMQ backend password}
      RABBITMQ_WORKER_USERNAME: ${RABBITMQ_WORKER_USERNAME:?Set an independent production RabbitMQ worker username}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?Set an independent production RabbitMQ worker password}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set a non-default production MinIO access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set a non-default production MinIO secret key}
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:?Set an independent production storage backend access key}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:?Set an independent production storage backend secret key}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?Set an independent production storage worker access key}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?Set an independent production storage worker secret key}
      JWT_SECRET: ${JWT_SECRET:?Set a non-default production JWT signing secret}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:?Set NGINX_HTTP_PORT=80 to publish the production edge}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      MINIO_BROWSER: "off"
      # Same expressions as backend/worker JAVA_TOOL_OPTIONS below, so the check sees what the JVMs receive.
      BACKEND_JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
      WORKER_JAVA_TOOL_OPTIONS: ${WORKER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=30 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./tests/production-config-check.sh:/checks/production-config-check.sh:ro
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a non-default production PostgreSQL username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default production PostgreSQL password}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  postgres-init:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a non-default production PostgreSQL username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default production PostgreSQL password}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:?Set an independent production PostgreSQL schema owner username}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set an independent production PostgreSQL schema owner password}
      POSTGRES_BACKEND_USER: ${POSTGRES_BACKEND_USER:?Set an independent production PostgreSQL backend username}
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:?Set an independent production PostgreSQL backend password}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:?Set an independent production PostgreSQL worker username}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set an independent production PostgreSQL worker password}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a non-default production Redis password}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set a non-default production RabbitMQ username}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set a non-default production RabbitMQ password}
      RABBITMQ_BACKEND_USERNAME: ${RABBITMQ_BACKEND_USERNAME:?Set an independent production RabbitMQ backend username}
      RABBITMQ_BACKEND_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:?Set an independent production RabbitMQ backend password}
      RABBITMQ_WORKER_USERNAME: ${RABBITMQ_WORKER_USERNAME:?Set an independent production RabbitMQ worker username}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?Set an independent production RabbitMQ worker password}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  minio:
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set a non-default production MinIO access key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set a non-default production MinIO secret key}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  backend:
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_BACKEND_USER:?Set an independent production PostgreSQL backend username}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:?Set an independent production PostgreSQL backend password}
      JWT_SECRET: ${JWT_SECRET:?Set a non-default production JWT signing secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a non-default production Redis password}
      RABBITMQ_USERNAME: ${RABBITMQ_BACKEND_USERNAME:?Set an independent production RabbitMQ backend username}
      RABBITMQ_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:?Set an independent production RabbitMQ backend password}
      MINIO_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:?Set an independent production storage access key}
      MINIO_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:?Set an independent production storage secret key}
      # #124: size the heap from the memory limit below, and exit on OutOfMemoryError so the restart policy
      # replaces the JVM instead of leaving one that still passes the TCP health check.
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  worker:
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_WORKER_USER:?Set an independent production PostgreSQL worker username}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set an independent production PostgreSQL worker password}
      RABBITMQ_USERNAME: ${RABBITMQ_WORKER_USERNAME:?Set an independent production RabbitMQ worker username}
      RABBITMQ_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?Set an independent production RabbitMQ worker password}
      MINIO_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?Set an independent production storage access key}
      MINIO_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?Set an independent production storage secret key}
      # #124: as the backend, with a smaller share because FFmpeg runs in this container's memory limit.
      JAVA_TOOL_OPTIONS: ${WORKER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=30 -XX:+ExitOnOutOfMemoryError}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  flyway:
    environment:
      FLYWAY_USER: ${POSTGRES_OWNER_USER:?Set an independent production PostgreSQL schema owner username}
      FLYWAY_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set an independent production PostgreSQL schema owner password}
      FLYWAY_PLACEHOLDERS_BACKEND_ROLE: ${POSTGRES_BACKEND_USER:?Set an independent production PostgreSQL backend username}
      FLYWAY_PLACEHOLDERS_WORKER_ROLE: ${POSTGRES_WORKER_USER:?Set an independent production PostgreSQL worker username}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set a non-default production MinIO access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set a non-default production MinIO secret key}
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:?Set an independent production storage backend access key}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:?Set an independent production storage backend secret key}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?Set an independent production storage worker access key}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?Set an independent production storage worker secret key}
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  nginx:
    depends_on:
      production-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
